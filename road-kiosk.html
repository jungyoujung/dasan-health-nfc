<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>다산별빛 헬스로드</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .card {
      max-width: 480px;
      margin: 20px auto;
      background: white;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input, select {
      width: 100%;
      height: 55px;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 0 12px;
      font-size: 18px;
      background: white;
    }

    .name {
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      min-height: 70px;
      border: none;
      border-radius: 15px;
      margin-top: 11px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .start {
      background: #2563eb;
      color: white;
    }

    .end {
      background: #16a34a;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    .result {
      margin-top: 20px;
      min-height: 75px;
      padding: 17px 12px;
      border-radius: 14px;
      background: #f3f4f6;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🚶 다산별빛 헬스로드</h1>

  <div class="subtitle">
    학생 정보를 입력한 뒤<br>
    시작 또는 종료 인증을 눌러주세요.
  </div>

  <div class="row">

    <select id="grade">
      <option value="">학년</option>
      <option value="1">1학년</option>
      <option value="2">2학년</option>
      <option value="3">3학년</option>
      <option value="4">4학년</option>
      <option value="5">5학년</option>
      <option value="6">6학년</option>
    </select>

    <input
      id="classNo"
      type="number"
      inputmode="numeric"
      placeholder="반">

    <input
      id="number"
      type="number"
      inputmode="numeric"
      placeholder="번호">

  </div>

  <input
    id="name"
    class="name"
    type="text"
    placeholder="이름">

  <button
    id="startBtn"
    class="start"
    onclick="sendRecord('road_start')">
    🚶 헬스로드 시작 인증
  </button>

  <button
    id="endBtn"
    class="end"
    onclick="sendRecord('road_end')">
    🏁 헬스로드 종료 인증
  </button>

  <div id="result" class="result">
    학생 정보를 입력해 주세요.
  </div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbxMOrWIMogseb47OrvQRHxBksL1F3YVEWR3huHESytELo2zJCSx4Dc651JK1RY0SDov/exec';


function setBusy(value) {
  document.getElementById('startBtn').disabled = value;
  document.getElementById('endBtn').disabled = value;
}


function clearForm() {
  document.getElementById('grade').value = '';
  document.getElementById('classNo').value = '';
  document.getElementById('number').value = '';
  document.getElementById('name').value = '';
}


function sendRecord(event) {

  const grade =
    document.getElementById('grade').value;

  const classNo =
    document.getElementById('classNo').value.trim();

  const number =
    document.getElementById('number').value.trim();

  const name =
    document.getElementById('name').value.trim();


  if (!grade || !classNo || !number || !name) {

    document.getElementById('result').innerHTML =
      '⚠️ 학년·반·번호·이름을 모두 입력해 주세요.';

    return;
  }


  setBusy(true);

  document.getElementById('result').innerHTML =
    '⏳ 인증 확인 중...';


  const callbackName =
    'roadCallback_' + Date.now();


  const script =
    document.createElement('script');


  let finished = false;


  const timer =
    setTimeout(function() {

      if (finished) return;

      finished = true;

      cleanup();

      setBusy(false);

      document.getElementById('result').innerHTML =
        '⚠️ 서버 연결이 어렵습니다.<br>다시 눌러주세요.';

    }, 12000);


  function cleanup() {

    clearTimeout(timer);

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch(e) {}
  }


  window[callbackName] = function(result) {

    if (finished) return;

    finished = true;

    cleanup();

    setBusy(false);


    if (result && result.success) {

      let studentText = '';

      if (result.student) {
        studentText =
          '<br><b>' +
          result.student.grade + '학년 ' +
          result.student.classNo + '반 ' +
          result.student.number + '번 ' +
          result.student.name +
          '</b>';
      }


      document.getElementById('result').innerHTML =
        '✅ ' +
        (result.message || '인증 완료') +
        studentText;


      setTimeout(function() {

        clearForm();

        document.getElementById('result').innerHTML =
          '다음 학생 정보를 입력해 주세요.';

      }, 3500);


    } else {

      document.getElementById('result').innerHTML =
        '⚠️ ' +
        ((result && result.message)
          ? result.message
          : '인증에 실패했습니다.');
    }
  };


  const query =
    new URLSearchParams({
      api: 'road_kiosk',
      grade: grade,
      classNo: classNo,
      number: number,
      name: name,
      event: event,
      callback: callbackName
    });


  script.src =
    API_URL +
    '?' +
    query.toString();


  script.onerror = function() {

    if (finished) return;

    finished = true;

    cleanup();

    setBusy(false);

    document.getElementById('result').innerHTML =
      '⚠️ 서버 연결에 실패했습니다.<br>다시 눌러주세요.';
  };


  document.body.appendChild(script);
}

</script>

</body>
</html>
