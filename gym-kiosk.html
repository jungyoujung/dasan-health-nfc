<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>다산별빛 헬스짐</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f4f7fb;
  color: #222;
}

.card {
  max-width: 480px;
  margin: 20px auto;
  background: white;
  border-radius: 22px;
  padding: 28px 22px;
  text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

.subtitle {
  color: #666;
  line-height: 1.6;
  margin-bottom: 25px;
}

.row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

input,
select {
  width: 100%;
  height: 55px;
  border: 1px solid #ccc;
  border-radius: 12px;
  padding: 0 12px;
  font-size: 18px;
  background: white;
}

.name {
  margin-bottom: 12px;
}

button {
  width: 100%;
  min-height: 76px;
  border: none;
  border-radius: 15px;
  margin-top: 12px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}

.gym {
  background: #7c3aed;
  color: white;
}

button:disabled {
  opacity: 0.5;
}

.result {
  margin-top: 20px;
  min-height: 80px;
  padding: 18px 12px;
  border-radius: 14px;
  background: #f3f4f6;
  font-size: 18px;
  line-height: 1.6;
}

</style>

</head>


<body>

<div class="card">

  <h1>🏋️ 다산별빛 헬스짐</h1>

  <div class="subtitle">
    학생 정보를 입력한 뒤<br>
    헬스짐 인증 버튼을 눌러주세요.<br><br>

    첫 인증 = 운동 시작<br>
    30분 후 인증 = 운동 완료
  </div>


  <div class="row">

    <select id="grade">

      <option value="">학년</option>

      <option value="1">1학년</option>
      <option value="2">2학년</option>
      <option value="3">3학년</option>
      <option value="4">4학년</option>
      <option value="5">5학년</option>
      <option value="6">6학년</option>

    </select>


    <input
      id="classNo"
      type="number"
      inputmode="numeric"
      placeholder="반">


    <input
      id="number"
      type="number"
      inputmode="numeric"
      placeholder="번호">

  </div>


  <input
    id="name"
    class="name"
    type="text"
    placeholder="이름">


  <button
    id="gymBtn"
    class="gym"
    onclick="sendGym()">

    🏋️ 헬스짐 인증

  </button>


  <div id="result"
       class="result">

    학생 정보를 입력해 주세요.

  </div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbxMOrWIMogseb47OrvQRHxBksL1F3YVEWR3huHESytELo2zJCSx4Dc651JK1RY0SDov/exec';


function setBusy(value) {

  document
    .getElementById('gymBtn')
    .disabled = value;
}


function clearForm() {

  document.getElementById('grade').value = '';
  document.getElementById('classNo').value = '';
  document.getElementById('number').value = '';
  document.getElementById('name').value = '';
}


function sendGym() {

  const grade =
    document.getElementById('grade').value;

  const classNo =
    document.getElementById('classNo').value.trim();

  const number =
    document.getElementById('number').value.trim();

  const name =
    document.getElementById('name').value.trim();


  if (
    !grade ||
    !classNo ||
    !number ||
    !name
  ) {

    document
      .getElementById('result')
      .innerHTML =
      '⚠️ 학년·반·번호·이름을 모두 입력해 주세요.';

    return;
  }


  setBusy(true);


  document
    .getElementById('result')
    .innerHTML =
    '⏳ 인증 확인 중...';


  const callbackName =
    'gymCallback_' + Date.now();


  const script =
    document.createElement('script');


  let finished = false;


  const timer =
    setTimeout(function() {

      if (finished) return;

      finished = true;

      cleanup();

      setBusy(false);

      document
        .getElementById('result')
        .innerHTML =
        '⚠️ 서버 연결이 어렵습니다.<br>다시 눌러주세요.';

    }, 12000);


  function cleanup() {

    clearTimeout(timer);

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch(e) {}
  }


  window[callbackName] =
    function(result) {

      if (finished) return;

      finished = true;

      cleanup();

      setBusy(false);


      if (!result) {

        document
          .getElementById('result')
          .innerHTML =
          '⚠️ 인증 결과를 확인할 수 없습니다.';

        return;
      }


      let studentText = '';

      if (result.student) {

        studentText =
          '<br><b>' +
          result.student.grade + '학년 ' +
          result.student.classNo + '반 ' +
          result.student.number + '번 ' +
          result.student.name +
          '</b>';
      }


      // 운동 시작
      if (result.started) {

        document
          .getElementById('result')
          .innerHTML =
          '✅ ' +
          (result.message || '헬스짐 운동 시작!') +
          studentText;

        resetLater();

        return;
      }


      // 아직 30분 전
      if (result.waiting) {

        document
          .getElementById('result')
          .innerHTML =
          '⏱️ 아직 완료되지 않았어요.<br>' +
          (result.message || '') +
          studentText;

        resetLater();

        return;
      }


      // 30분 완료
      if (result.completed) {

        document
          .getElementById('result')
          .innerHTML =
          '🎉 헬스짐 운동 완료!<br>' +
          (result.message || '') +
          studentText;

        resetLater();

        return;
      }


      if (result.success) {

        document
          .getElementById('result')
          .innerHTML =
          '✅ ' +
          (result.message || '인증 완료') +
          studentText;

        resetLater();

        return;
      }


      document
        .getElementById('result')
        .innerHTML =
        '⚠️ ' +
        (result.message || '인증에 실패했습니다.');
    };


  function resetLater() {

    setTimeout(function() {

      clearForm();

      document
        .getElementById('result')
        .innerHTML =
        '다음 학생 정보를 입력해 주세요.';

    }, 4000);
  }


  const query =
    new URLSearchParams({

      api: 'gym_kiosk',

      grade: grade,

      classNo: classNo,

      number: number,

      name: name,

      callback: callbackName
    });


  script.src =
    API_URL +
    '?' +
    query.toString();


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      cleanup();

      setBusy(false);

      document
        .getElementById('result')
        .innerHTML =
        '⚠️ 서버 연결에 실패했습니다.<br>다시 눌러주세요.';
    };


  document.body.appendChild(script);
}

</script>

</body>
</html>
