<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다산별빛 건강활동</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .card {
      max-width: 480px;
      margin: 35px auto;
      background: white;
      border-radius: 22px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 27px;
      margin-bottom: 20px;
    }

    .icon {
      font-size: 60px;
      margin: 20px 0;
    }

    .title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .message {
      font-size: 18px;
      line-height: 1.6;
    }

    .student {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #f3f4f6;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .device {
      margin-top: 18px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1 id="mainTitle">🌟 다산별빛 건강활동</h1>

  <div id="icon" class="icon">⏳</div>

  <div id="title" class="title">
    인증 확인 중
  </div>

  <div id="message" class="message">
    잠시만 기다려 주세요.
  </div>

  <div id="student" class="student"></div>

  <div id="device" class="device"></div>

</div>

<script>

const API_URL =
 'https://script.google.com/macros/s/AKfycbzfOVkhTXrT6RGw_T1dbil0u-gvoMF0WFFI5EBUjk8PBXpcG_JIGrWlwlArpGXNU22E/exec';

const ROLE_KEY = 'dasan_kiosk_role';

const params = new URLSearchParams(window.location.search);

const token = (params.get('token') || '').trim();

const role = localStorage.getItem(ROLE_KEY) || '';

const roleNames = {
  road_start: '헬스로드 출발',
  road_end: '헬스로드 도착',
  gym_auto: '헬스짐'
};

const mainTitles = {
  road_start: '🚶 다산별빛 헬스로드',
  road_end: '🏁 다산별빛 헬스로드',
  gym_auto: '🏋️ 다산별빛 헬스짐'
};


function show(icon, title, message, student) {

  document.getElementById('icon').textContent = icon;
  document.getElementById('title').textContent = title;
  document.getElementById('message').textContent =
    message || '';

  const studentBox =
    document.getElementById('student');

  if (student) {

    studentBox.textContent =
      student.grade + '학년 ' +
      student.classNo + '반 ' +
      student.number + '번 ' +
      student.name;

    studentBox.style.display = 'block';

  } else {

    studentBox.style.display = 'none';
  }
}


function handleResult(result) {

  if (!result) {
    show('⚠️', '인증 오류',
         '서버 응답을 확인할 수 없습니다.');
    return;
  }

  if (result.completed) {
    show('🎉', '완료 성공!',
         result.message,
         result.student);
    return;
  }

  if (result.waiting) {
    show('⏱️', '아직 완료되지 않았어요',
         result.message,
         result.student);
    return;
  }

  if (result.started) {
    show('✅', '시작 인증 완료',
         result.message,
         result.student);
    return;
  }

  if (result.alreadyStarted) {
    show('✅', '이미 시작 인증되었습니다',
         result.message,
         result.student);
    return;
  }

  if (result.success) {
    show('✅', '인증 완료',
         result.message,
         result.student);
    return;
  }

  show('⚠️', '인증 실패',
       result.message || '다시 태그해 주세요.',
       result.student);
}


function callServer() {

  const callbackName =
    'nfcCallback_' + Date.now();

  window[callbackName] = function(result) {

    handleResult(result);

    try {
      delete window[callbackName];
    } catch (e) {}
  };

  const script =
    document.createElement('script');

  const query =
    new URLSearchParams({
      api: 'record',
      token: token,
      event: role,
      callback: callbackName
    });

  script.src =
    API_URL + '?' + query.toString();

  script.onerror = function() {
    show(
      '⚠️',
      '서버 연결 실패',
      '서버와 연결되지 않았습니다.'
    );
  };

  document.body.appendChild(script);


  setTimeout(function() {

    if (
      document.getElementById('title')
        .textContent === '인증 확인 중'
    ) {

      show(
        '⚠️',
        '응답 지연',
        '서버 응답이 없습니다. 다시 태그해 주세요.'
      );
    }

  }, 12000);
}


function start() {

  document.getElementById('mainTitle').textContent =
    mainTitles[role] ||
    '🌟 다산별빛 건강활동';

  document.getElementById('device').textContent =
    role
      ? '현재 기기: ' + (roleNames[role] || role)
      : '기기 역할이 설정되지 않았습니다.';


  if (!token || !token.startsWith('CARD-')) {

    show(
      '⚠️',
      '잘못된 NFC',
      '학생 NFC 정보를 확인해 주세요.'
    );

    return;
  }


  if (!role) {

    show(
      '⚙️',
      '기기 설정 필요',
      '먼저 setup.html에서 이 기기의 역할을 설정해 주세요.'
    );

    return;
  }


  callServer();
}


start();

</script>

</body>
</html>
